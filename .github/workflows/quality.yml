name: quality

on:
  pull_request:
  push:
    branches:
      - codex/**

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation and CI safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v4.4.0, verified against the official tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run validator regression tests
        run: python -B -m unittest discover -s .github/scripts/tests -p "test_*.py" -v
      - name: Validate required SDD, requirement IDs, statuses, and links
        run: python -B .github/scripts/validate_docs.py
      - name: Validate the real-only desktop production boundary
        run: python -B .github/scripts/validate_real_only_desktop.py
      - name: Run static destructive-storage guard
        run: python -B .github/scripts/validate_ci_safety.py

  rust:
    name: Rust format, lint, test, and release smoke
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNDELETE_MASTER_ALLOW_REAL_DEVICES: "0"
      UNDELETE_MASTER_DEVICE_TEST_MODE: "deny"
      RUST_BACKTRACE: "1"
    steps:
      # actions/checkout v4.4.0, verified against the official tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test deterministic workspace
        run: cargo test --workspace --locked
      - name: Release build smoke
        run: cargo build --workspace --release --locked

  frontend:
    name: Frontend and native desktop build
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      UNDELETE_MASTER_ALLOW_REAL_DEVICES: "0"
      UNDELETE_MASTER_DEVICE_TEST_MODE: "deny"
    steps:
      # actions/checkout v4.4.0, verified against the official tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-node v4.4.0, verified against the official tag.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.17.1
      - name: Activate pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Install from lockfile
        working-directory: apps/desktop
        # Dependency/project lifecycle scripts are outside the deterministic PR
        # command allowlist. Vite uses its pinned optional platform package.
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint
        working-directory: apps/desktop
        run: pnpm lint
      - name: Typecheck
        working-directory: apps/desktop
        run: pnpm typecheck
      - name: Test
        working-directory: apps/desktop
        run: pnpm test
      - name: Build
        working-directory: apps/desktop
        run: pnpm build
      - name: Build the unelevated Tauri executable without an installer
        working-directory: apps/desktop
        run: pnpm tauri build --no-bundle
