[package]
name = "um-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Unelevated real-only desktop image scanner for Undelete Master"

[lib]
name = "um_desktop"
path = "src/lib.rs"

[[bin]]
name = "undelete-master-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = { version = "=2.7.2" }
um-cli = { workspace = true }
um-fs-common = { workspace = true }

[dev-dependencies]
crc32fast = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
um-core = { workspace = true }
um-fixture-builder = { workspace = true }
