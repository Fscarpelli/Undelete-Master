[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/io-common",
    "crates/partition",
    "crates/fs-common",
    "crates/fs-ntfs",
    "crates/fs-fat",
    "crates/carving",
    "crates/restore",
    "crates/fixture-builder",
    "crates/cli",
    "crates/io-windows",
    "crates/broker-protocol",
    "crates/broker-client",
    "crates/elevated-broker",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Fscarpelli/Undelete-Master"
rust-version = "1.88"

[workspace.dependencies]
um-core = { path = "crates/core" }
um-io-common = { path = "crates/io-common" }
um-partition = { path = "crates/partition" }
um-fs-common = { path = "crates/fs-common" }
um-fs-ntfs = { path = "crates/fs-ntfs" }
um-fs-fat = { path = "crates/fs-fat" }
um-fs-exfat = { path = "crates/fs-exfat" }
um-carving = { path = "crates/carving" }
um-restore = { path = "crates/restore" }
um-fixture-builder = { path = "crates/fixture-builder" }
um-cli = { path = "crates/cli" }
um-io-windows = { path = "crates/io-windows" }
um-broker-protocol = { path = "crates/broker-protocol" }
um-broker-client = { path = "crates/broker-client" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
crc32fast = "1"
hex = "0.4"
proptest = "1"
tempfile = "3"
libc = "0.2"
getrandom = "0.3.4"
subtle = "2.6"
cap-std = "=4.0.2"
cap-fs-ext = "=4.0.2"

[profile.release]
opt-level = 3
lto = "thin"
